<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management System</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6fb;color:#1d2638}header{background:white;padding:18px 6%;font-size:23px;font-weight:bold;color:#5146d8;box-shadow:0 2px 10px #0001}main{max-width:1000px;margin:30px auto;padding:0 16px}h1{font-size:28px}p,.muted{color:#687386}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.card{background:white;padding:20px;border:1px solid #e5e7ef;border-radius:14px;margin-bottom:18px}.stats strong{display:block;font-size:28px;margin-top:8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field select,#search{width:100%;padding:12px;border:1px solid #dce0ea;border-radius:8px;font-size:15px}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer;margin:12px 6px 0 0}.primary{background:#5146d8;color:white}.light{background:#eeedff;color:#5146d8}.danger{background:#fff0f1;color:#c83245}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}#search{max-width:300px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px;margin-top:14px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #e8eaf0;font-size:14px}th{color:#687386;font-size:12px}.empty{text-align:center;padding:24px;color:#687386}footer{text-align:center;padding:20px;color:#687386}@media(max-width:600px){.fields{grid-template-columns:1fr}.stats{gap:8px}.card{padding:14px}.stats strong{font-size:22px}h1{font-size:23px}}
</style></head><body><header>EduManage</header><main><h1>Student Management System</h1><p>Manage student records in one simple place.</p><section class="stats"><div class="card">Total Students<strong id="total">0</strong></div><div class="card">Departments<strong id="deps">0</strong></div><div class="card">Available Actions<strong>3</strong></div></section><section class="card"><h2 id="heading">Add New Student</h2><form id="form"><div class="fields"><div class="field"><label>Student Name *</label><input id="name" required placeholder="Enter name"></div><div class="field"><label>Roll Number *</label><input id="roll" required placeholder="Enter roll number"></div><div class="field"><label>Email *</label><input id="email" type="email" required placeholder="student@example.com"></div><div class="field"><label>Department *</label><select id="dept" required><option value="">Select department</option><option>Computer Science</option><option>Information Technology</option><option>Electronics</option><option>Commerce</option></select></div></div><button class="btn primary" id="submit">＋ Add Student</button><button class="btn light" type="reset" onclick="resetForm()">Clear</button></form></section><section class="card"><div class="toolbar"><h2>Student Records</h2><input id="search" placeholder="Search students..."></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Roll No.</th><th>Email</th><th>Department</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div class="empty" id="empty">No students yet. Add your first student above.</div></section></main><footer>© 2026 EduManage Student Management System</footer><script>
let data=JSON.parse(localStorage.getItem('eduStudents')||'[]'),editing=null;const $=x=>document.getElementById(x);
function safe(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('eduStudents',JSON.stringify(data));render()}
function resetForm(){editing=null;$('heading').textContent='Add New Student';$('submit').textContent='＋ Add Student'}
$('form').onsubmit=e=>{e.preventDefault();let s={id:editing||Date.now(),name:$('name').value.trim(),roll:$('roll').value.trim(),email:$('email').value.trim(),dept:$('dept').value};if(data.some(x=>x.roll.toLowerCase()===s.roll.toLowerCase()&&x.id!==editing)){alert('Roll number already exists');return}if(editing)data=data.map(x=>x.id===editing?s:x);else data.push(s);save();$('form').reset();resetForm()};
function edit(id){let s=data.find(x=>x.id===id);editing=id;$('name').value=s.name;$('roll').value=s.roll;$('email').value=s.email;$('dept').value=s.dept;$('heading').textContent='Edit Student';$('submit').textContent='Save Changes';scrollTo({top:0,behavior:'smooth'})}
function del(id){if(confirm('Delete this student?')){data=data.filter(x=>x.id!==id);save();if(editing===id){$('form').reset();resetForm()}}}
function render(){let q=$('search').value.toLowerCase(),list=data.filter(s=>[s.name,s.roll,s.email,s.dept].some(v=>v.toLowerCase().includes(q)));$('rows').innerHTML=list.map(s=>`<tr><td><b>${safe(s.name)}</b></td><td>${safe(s.roll)}</td><td>${safe(s.email)}</td><td>${safe(s.dept)}</td><td><button class="btn light" onclick="edit(${s.id})">Edit</button><button class="btn danger" onclick="del(${s.id})">Delete</button></td></tr>`).join('');$('empty').style.display=list.length?'none':'block';$('total').textContent=data.length;$('deps').textContent=new Set(data.map(x=>x.dept)).size}
$('search').addEventListener('input',render);render();
</script></body></html>
